# The apex and every subdomain go to Varnish. Subdomains (water.is.gratis) need a wildcard
# certificate, which Let's Encrypt only issues through a DNS-01 challenge; with cert-manager,
# uncomment the annotation and point it at an issuer that can update your DNS zone.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: isgratis
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-dns01
    # Varnish needs the real Host header for subdomain redirects; most controllers keep it.
    # Image uploads can be up to 10 MB; ingress-nginx allows 1 MB by default.
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
spec:
  # ingressClassName: nginx
  tls:
    - hosts:
        - is.gratis
        - '*.is.gratis'
      secretName: isgratis-tls
  rules:
    - host: is.gratis
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: varnish
                port:
                  name: http
    - host: '*.is.gratis'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: varnish
                port:
                  name: http
