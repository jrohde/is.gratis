apiVersion: v1
kind: ConfigMap
metadata:
  name: isgratis-config
data:
  # Public addresses
  PUBLIC_ORIGIN: https://is.gratis
  BASE_DOMAIN: is.gratis
  TRUSTED_ORIGINS: https://is.gratis,https://*.is.gratis
  COOKIE_DOMAIN: .is.gratis
  COOKIE_SECURE: 'true'
  # Internal addresses
  API_INTERNAL_URL: http://api:4000
  CACHE_BAN_TARGET: varnish-purge:8081
  # Migrations run in the API's init container, not in every process.
  MIGRATE_ON_START: 'false'
  LOG_LEVEL: info
  # Ingress + Varnish in front of the API: trust exactly two X-Forwarded-For hops.
  TRUST_PROXY: '2'
  # LLM for first drafts: any OpenAI-compatible endpoint. Point it at a model in this cluster
  # (see optional/ollama.yaml) to keep everything in-house.
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
  # Illustrations through an OpenAI-compatible images endpoint. Empty IMAGE_MODEL turns it off.
  # IMAGE_BASE_URL and IMAGE_API_KEY default to the LLM settings.
  IMAGE_MODEL: ''
  IMAGE_SIZE: 1536x1024
  # Give every new LLM draft an illustration as well.
  DRAFT_WITH_IMAGE: 'false'
  DRAFT_RATE_LIMIT_PER_HOUR: '3'
  DRAFT_GLOBAL_LIMIT_PER_HOUR: '200'
  ADMIN_EMAILS: ''
  # Monthly price of a sponsored spot: base price plus a price per 1000 views (last 30 days).
  SPONSOR_BASE_PRICE_CENTS: '2500'
  SPONSOR_PRICE_PER_1000_VIEWS_CENTS: '400'
  # Monthly extra for an offer that is also in the weekly mail of free offers.
  SPONSOR_MAILING_PRICE_CENTS: '500'
  # Being the only offer on a page for its readers costs this percentage of the normal price.
  SPONSOR_EXCLUSIVE_PERCENT: '250'
  # Invoicing: approving an offer issues an invoice. Your details are printed on every invoice.
  BILLING_ENABLED: 'true'
  COMPANY_NAME: 'is.gratis'
  COMPANY_ADDRESS: 'Straat 1|1234 AB Plaats'
  COMPANY_KVK: ''
  COMPANY_VAT_NUMBER: ''
  COMPANY_IBAN: ''
  COMPANY_BIC: ''
  VAT_RATE_BPS: '2100'
  INVOICE_DUE_DAYS: '14'
  # Before every invoice number (IG2026-0001), so this series never mixes with your other invoices.
  INVOICE_PREFIX: 'IG'
  # Mail goes out through your own SMTP server (SMTP_URL in the Secret, e.g.
  # smtp://user:pass@mail.mail.svc:587). Without it the bot only writes mail to its log.
  MAIL_FROM: 'is.gratis <hallo@is.gratis>'
  # The weekly mails: day (0 = Sunday, 1 = Monday) and time (UTC).
  MAIL_WEEKLY_DAY: '1'
  MAIL_WEEKLY_TIME: '08:00'
  MAIL_PER_MINUTE: '60'
  # The worker checks source links between drafts. It needs outbound HTTP(S) to the internet,
  # and refuses private and cluster-internal addresses by itself.
  SOURCE_CHECKS: 'true'
  # The search page asks the LLM for related subjects, once per query, at most this many per hour.
  SEARCH_RELATED: 'true'
  # The bot posts the free thing of the day from this time (UTC). Accounts go in the Secret
  # (BOT_MASTODON, BOT_BLUESKY); BOT_DRY_RUN_LANGUAGES=nl,en only writes the posts to the log.
  BOT_DAILY_TIME: '07:00'
  BOT_DRY_RUN_LANGUAGES: ''
  # Each night the bot queues first drafts for the most wanted subjects without a page
  # (per language; 0 switches it off). A search without result counts 1, a link to it 3.
  BOT_DRAFTS_PER_DAY: '5'
  BOT_DRAFTS_TIME: '03:00'
  BOT_DRAFTS_MIN_WEIGHT: '3'
  # The editorial language model checks LLM drafts every ten minutes and publishes them, publishes
  # a corrected version, or leaves them for people. Uses the LLM_* settings unless EDITOR_MODEL,
  # EDITOR_BASE_URL (and EDITOR_API_KEY in the Secret) point at another, preferably stronger, model.
  EDITOR_ENABLED: 'true'
  EDITOR_PER_RUN: '5'
  SEARCH_RELATED_PER_HOUR: '120'
  SOURCE_CHECK_INTERVAL_DAYS: '7'
---
# Create the real secret yourself; this file only documents its keys:
#   kubectl -n isgratis create secret generic isgratis-secrets \
#     --from-literal=IP_HASH_SALT="$(openssl rand -hex 32)" \
#     --from-literal=LLM_API_KEY=sk-... \
#     --from-literal=IMAGE_API_KEY= \
#     --from-literal=EDITOR_API_KEY= \
#     --from-literal=MOLLIE_API_KEY=live_... \
#     --from-literal=SMTP_URL='smtp://user:password@mail.example:587' \
#     --from-literal=BOT_MASTODON='[{"lang":"nl","url":"https://mastodon.example","token":"..."}]' \
#     --from-literal=BOT_BLUESKY='[{"lang":"en","identifier":"isgratis.bsky.social","password":"app-password"}]'
# (Both keys may be empty for a model in your own cluster.)
